<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; margin: 0; }
        
        .ref-card {
            background: linear-gradient(135deg, #6a11cb, #2575fc); padding: 25px;
            border-radius: 20px; text-align: center; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(37, 117, 252, 0.3);
        }
        .code-box {
            background: rgba(255,255,255,0.2); border: 1px dashed white;
            padding: 10px; margin: 15px 0; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; border-radius: 10px;
        }
        
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .box { background: #1a1a2e; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        .box h2 { margin: 5px 0; font-size: 1.5rem; }
        
        .member-list { margin-top: 20px; }
        .member {
            background: #1a1a2e; padding: 15px; border-radius: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;
        }
        .active-tag { color: #00f260; background: rgba(0,242,96,0.1); padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; }
        .inactive-tag { color: #e74c3c; background: rgba(231, 76, 60, 0.1); padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; }

    </style>
</head>
<body>
    <a href="home.html" style="color:white; text-decoration:none; display:block; margin-bottom:20px;">← Back to Home</a>

    <div class="ref-card">
        <p style="margin:0; opacity:0.8;">Your Referral Code</p>
        <div class="code-box" id="myCode">...</div>
        <button onclick="copyLink()" style="background:white; color:#2575fc; border:none; padding:8px 20px; border-radius:20px; font-weight:bold; cursor:pointer;">Copy Link</button>
    </div>

    <div class="stats">
        <div class="box">
            <h2 id="totalMembers">0</h2>
            <small style="color:#aaa;">Total Members</small>
        </div>
        <div class="box">
            <h2 id="activeMembers" style="color:#00f260;">0</h2>
            <small style="color:#aaa;">Active Income Users</small>
        </div>
    </div>

    <h3>My Downline (Level 1)</h3>
    <div class="member-list" id="list">
        <p style="text-align:center; color:#666;">Loading members...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid + '/ownCode').once('value', (snap) => {
                    const code = snap.val();
                    if(code) {
                        document.getElementById('myCode').innerText = code;
                        loadTeam(code);
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function loadTeam(myCode) {
            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (snapshot) => {
                const list = document.getElementById('list');
                list.innerHTML = "";
                let total = 0;
                let activeCount = 0;

                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const u = child.val();
                        total++;
                        if(u.status === 'active') activeCount++;

                        const statusHtml = u.status === 'active' 
                            ? `<span class="active-tag">Active</span>` 
                            : `<span class="inactive-tag">Pending Payment</span>`;

                        const html = `
                            <div class="member">
                                <div>
                                    <b>${u.firstName}</b><br>
                                    <small style="color:#aaa;">${u.phone}</small>
                                </div>
                                ${statusHtml}
                            </div>
                        `;
                        list.innerHTML += html;
                    });
                } else {
                    list.innerHTML = '<p style="text-align:center; color:#555;">No members yet.</p>';
                }

                document.getElementById('totalMembers').innerText = total;
                document.getElementById('activeMembers').innerText = activeCount;
            });
        }

            const code = document.getElementById('myCode'
