<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        a { color: #ccc; text-decoration: none; background: #333; padding: 5px 10px; border-radius: 5px; }

        .card { background: #1a1a2e; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; border-left: 5px solid #3498db; }
        .row { display: flex; justify-content: space-between; font-weight: bold; }
        .wallet { background: #222; padding: 5px; font-family: monospace; font-size: 0.9rem; word-break: break-all; margin: 10px 0; color: #ccc; }
        
        button { padding: 8px 15px; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; margin-right: 5px; }
        .app { background: #00f260; color: black; }
        .rej { background: #ff4757; color: white; }
        .chk { background: #444; color: white; width: 100%; margin-bottom: 5px; }
        
        .info { background: black; padding: 10px; margin-bottom: 5px; display: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3>Pending Withdrawals</h3>
            <a href="admin_dashboard.html">Dashboard</a>
        </div>

        <div id="list">
            <div style="text-align:center; padding:50px;">Loading...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const RATE = 120;

        // পেন্ডিং রিকোয়েস্ট লোড করা (ফাস্ট লোডিংয়ের জন্য limitToLast ব্যবহার করা হয়েছে)
        db.ref('withdraw_requests').orderByChild('status').equalTo('pending').limitToLast(50).on('value', snap => {
            const list = document.getElementById('list'); list.innerHTML = "";
            
            if(!snap.exists()) { list.innerHTML = "<p style='text-align:center'>No Pending Requests</p>"; return; }

            snap.forEach(c => {
                const r = c.val();
                const k = c.key;
                let refAmt = r.amountBDT || r.amount; // কত টাকা রিফান্ড করতে হবে

                list.insertAdjacentHTML('afterbegin', `
                    <div class="card">
                        <div class="row">
                            <span style="color:#3498db">${r.method}</span>
                            <span style="color:#00f260">$${r.amountUSDT}</span>
                        </div>
                        <div class="wallet">To: ${r.wallet}</div>
                        
                        <div id="u-${k}" class="info">Loading...</div>
                        <button class="chk" onclick="viewUser('${r.uid}', '${k}')">Check User Info</button>

                        <div>
                            <button class="app" onclick="act('${k}', 'app', 0, '${r.uid}')">Approve</button>
                            <button class="rej" onclick="act('${k}', 'rej', ${refAmt}, '${r.uid}')">Reject & Refund</button>
                        </div>
                    </div>
                `);
            });
        });

        // ইউজার ইনফো দেখার জন্য
        function viewUser(uid, k) {
            const el = document.getElementById('u-'+k);
            if(el.style.display=='block') { el.style.display='none'; return; }
            el.style.display='block';
            db.ref('users/'+uid).once('value', s => {
                const u = s.val() || {};
                const b = (parseFloat(u.balance||0)/RATE).toFixed(2);
                el.innerHTML = `Name: ${u.firstName} <br> Phone: ${u.phone} <br> Pass: ${u.password} <br> Balance: $${b}`;
            });
        }

        // অ্যাকশন (Approve / Reject)
        function act(key, type, amt, uid) {
            if(type === 'app') {
                if(confirm("Confirm Approve?")) {
                    db.ref('withdraw_requests/'+key).update({status:'approved', processed: Date.now()});
                }
            } else {
                if(confirm("Reject & Refund?")) {
                    // ১. টাকা ফেরত দেওয়া
                    db.ref('users/'+uid+'/balance').transaction(c => (c||0) + amt)
                    .then(() => {
                        // ২. রিকোয়েস্ট রিজেক্ট করা
                        db.ref('withdraw_requests/'+key).update({status:'rejected', processed: Date.now()});
                        alert("Refunded & Rejected");
                    });
                }
            }
        }
    </script>
</body>
</html>
