<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { color: #aaa; text-decoration: none; font-size: 1.2rem; margin-right: 15px; }
        .card { background: #1a1a2e; padding: 25px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #ccc; font-size: 0.9rem; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0f0c29; border: 1px solid #444; color: white; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: #00f260; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0f0c29; }
    </style>
</head>
<body>
    <div class="header">
        <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <h2>System Settings</h2>
    </div>

    <div class="card">
        <h3 style="color:#f1c40f;"><i class="fas fa-wallet"></i> Payment Info</h3>
        <div class="input-group"><label>Account Activation Fee (Tk)</label><input type="number" id="actFee"></div>
        <div class="input-group"><label>Admin Personal Number</label><input type="number" id="adminPhone"></div>
        <button onclick="savePay()">Update Payment Settings</button>
    </div>

    <div class="card">
        <h3 style="color:#3498db;"><i class="fas fa-users"></i> Referral Commissions</h3>
        <div class="input-group"><label>Level 1 Commission</label><input type="number" id="lvl1"></div>
        <div class="input-group"><label>Level 2 Commission</label><input type="number" id="lvl2"></div>
        <div class="input-group"><label>Level 3 Commission</label><input type="number" id="lvl3"></div>
        <button onclick="saveRef()">Update Commissions</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('settings').once('value', (snap) => {
            const d = snap.val() || {};
            if(d.payment) { document.getElementById('actFee').value = d.payment.fee; document.getElementById('adminPhone').value = d.payment.number; }
            // Correct Path Used Here
            if(d.commissions) { 
                document.getElementById('lvl1').value = d.commissions.level1; 
                document.getElementById('lvl2').value = d.commissions.level2; 
                document.getElementById('lvl3').value = d.commissions.level3; 
            }
        });

        function savePay() {
            db.ref('settings/payment').set({ fee: Number(document.getElementById('actFee').value), number: document.getElementById('adminPhone').value })
            .then(() => alert("Payment Info Updated!"));
        }

        function saveRef() {
            db.ref('settings/commissions').set({ 
                level1: Number(document.getElementById('lvl1').value), 
                level2: Number(document.getElementById('lvl2').value), 
                level3: Number(document.getElementById('lvl3').value) 
            }).then(() => alert("Commission Rates Updated!"));
        }
    </script>
</body>
</html>
