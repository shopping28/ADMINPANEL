<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - User List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { color: #aaa; text-decoration: none; font-size: 1.1rem; }
        
        /* Search Box */
        .search-box {
            width: 100%; padding: 12px; margin-bottom: 20px; 
            background:#1a1a2e; border:1px solid #444; color:white; 
            border-radius: 8px; box-sizing: border-box; font-size: 1rem;
        }
        .search-box:focus { border-color: #00f260; outline: none; }

        /* User Card Style */
        .user-card { 
            background: #1a1a2e; padding: 20px; border-radius: 10px; margin-bottom: 15px; 
            border-left: 5px solid #3498db; display: flex; 
            justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
            transition: 0.3s;
        }
        .user-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .info-group p { margin: 5px 0; font-size: 0.95rem; color: #ccc; }
        .info-group strong { color: #00f260; display: inline-block; width: 100px; }
        .pass-text { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.1); padding: 2px 6px; border-radius: 4px; }

        /* Buttons */
        .actions { display: flex; flex-direction: column; gap: 10px; min-width: 120px; }
        .btn { padding: 8px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-active { background: #2ecc71; }
        .btn-ban { background: #e74c3c; }
        
        /* Status Colors */
        .st-active { color: #2ecc71; font-weight: bold; }
        .st-banned { color: #e74c3c; font-weight: bold; }
        .st-pending { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="admin_dashboard.html" class="back-btn">← Back Dashboard</a>
        <h2>User Management</h2>
    </div>
    
    <!-- Search Input -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by Name or Phone Number..." onkeyup="filterUsers()">
    
    <div id="userListContainer">
        <p style="text-align:center; color:#aaa;">Loading users...</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allUsers = [];

        // 1. Load Users Realtime (Live Update)
        db.ref('users').on('value', snapshot => {
            allUsers = [];
            if(snapshot.exists()){
                snapshot.forEach(childSnapshot => {
                    allUsers.push({ key: childSnapshot.key, ...childSnapshot.val() });
                });
                allUsers.reverse(); // Show new users first
                renderUsers(allUsers);
            } else {
                document.getElementById('userListContainer').innerHTML = "<p style='text-align:center;'>No users found.</p>";
            }
        });

        // 2. Render Function
        function renderUsers(users) {
            const container = document.getElementById('userListContainer');
            container.innerHTML = "";

            if (users.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#aaa;'>No matching users found.</p>";
                return;
            }

            users.forEach(user => {
                const status = user.status || 'pending';
                const statusClass = status === 'active' ? 'st-active' : (status === 'banned' ? 'st-banned' : 'st-pending');
                
                // Password Field (Auto Updates)
                const password = user.password || "Not Saved"; 

                container.innerHTML += `
                    <div class="user-card">
                        <div class="info-group">
                            <p><strong>Name:</strong> ${user.firstName} ${user.lastName || ''}</p>
                            <p><strong>Phone:</strong> ${user.phone}</p>
                            <p><strong>Password:</strong> <span class="pass-text">${password}</span></p>
                            <p><strong>Balance:</strong> ৳${user.balance || 0}</p>
                            <p><strong>Status:</strong> <span class="${statusClass}">${status.toUpperCase()}</span></p>
                            <p><strong>Ref Code:</strong> ${user.ownCode || 'N/A'}</p>
                            <p style="font-size:0.8rem; color:#555;">ID: ${user.key}</p>
                        </div>
                        <div class="actions">
                            <button class="btn btn-active" onclick="setStatus('${user.key}', 'active')">Activate</button>
                            <button class="btn btn-ban" onclick="setStatus('${user.key}', 'banned')">Ban User</button>
                        </div>
                    </div>`;
            });
        }

        // 3. Change Status Function
        function setStatus(uid, status) {
            if(confirm(`Are you sure you want to make this user ${status}?`)) {
                db.ref('users/' + uid).update({ status: status });
            }
        }

        // 4. Search Filter
        function filterUsers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.phone && u.phone.includes(term)) || 
                (u.firstName && u.firstName.toLowerCase().includes(term))
            );
            renderUsers(filtered);
        }
    </script>
</body>
</html>
