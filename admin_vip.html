<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | VIP Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM ADMIN THEME === */
        :root {
            --bg: #0f0c29; --card: #1b1b2f; --border: #333;
            --gold: #f1c40f; --green: #00f260; --red: #ff4757;
            --text: #ffffff; --muted: #a0a0a0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }

        /* HEADER */
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; }
        .back-btn { background: #222; color: #ccc; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; }
        .back-btn:hover { background: #333; color: white; }
        h2 { font-weight: 700; color: var(--gold); }

        /* INPUT FORM */
        .form-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0b0b15; border: 1px solid #444; color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }

        .btn-add { width: 100%; background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { opacity: 0.9; transform: translateY(-2px); }

        /* LEVEL LIST */
        .level-list { display: flex; flex-direction: column; gap: 10px; }
        .lvl-item { 
            background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .lvl-info { display: flex; gap: 15px; align-items: center; }
        .lvl-badge { background: #333; color: var(--gold); padding: 5px 10px; border-radius: 5px; font-weight: 700; font-size: 0.85rem; border: 1px solid #444; }
        .lvl-detail { font-size: 0.95rem; }
        .lvl-detail span { color: var(--green); font-weight: bold; }

        .btn-del { background: rgba(255, 71, 87, 0.1); color: var(--red); border: 1px solid var(--red); padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-del:hover { background: var(--red); color: white; }

        .empty-msg { text-align: center; color: var(--muted); margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <h2>Manage VIP Levels</h2>
        </div>

        <!-- ADD FORM -->
        <div class="form-card">
            <h4 style="margin-bottom:15px; color:#fff;">Add / Update Level</h4>
            <div class="form-grid">
                <div>
                    <label>Level No</label>
                    <input type="number" id="ln" placeholder="Ex: 1">
                </div>
                <div>
                    <label>Target Ref</label>
                    <input type="number" id="lt" placeholder="Ex: 5">
                </div>
                <div>
                    <label>Reward ($)</label>
                    <input type="number" id="lb" placeholder="Ex: 0.83">
                </div>
            </div>
            <button onclick="addLevel()" class="btn-add"><i class="fas fa-plus-circle"></i> Save Level</button>
        </div>

        <!-- LIST AREA -->
        <h4 style="margin-bottom:10px; color:var(--muted); text-transform:uppercase; font-size:0.9rem;">Active Levels</h4>
        <div id="list" class="level-list">
            <div class="empty-msg">Loading levels...</div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // UPDATED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ADD FUNCTION
        function addLevel() {
            const n = document.getElementById('ln').value;
            const target = document.getElementById('lt').value;
            const bonus = document.getElementById('lb').value;

            if(!n || !target || !bonus) return alert("Please fill all fields!");

            db.ref('settings/vip_levels/level' + n).set({
                id: Number(n),
                target: Number(target),
                reward: Number(bonus)
            }).then(() => {
                alert("VIP Level Added Successfully!");
                document.getElementById('ln').value = "";
                document.getElementById('lt').value = "";
                document.getElementById('lb').value = "";
            });
        }

        // FETCH & DISPLAY
        db.ref('settings/vip_levels').orderByChild('id').on('value', s => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            
            if(!s.exists()) {
                list.innerHTML = `<div class="empty-msg">No levels configured yet.</div>`;
                return;
            }

            s.forEach(c => {
                const data = c.val();
                const html = `
                    <div class="lvl-item">
                        <div class="lvl-info">
                            <div class="lvl-badge">LVL ${data.id}</div>
                            <div class="lvl-detail">
                                Target: <b>${data.target}</b> Refs
                                <br>
                                Reward: <span>$${data.reward}</span>
                            </div>
                        </div>
                        <button class="btn-del" onclick="del('${c.key}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.innerHTML += html;
            });
        });

        // DELETE FUNCTION
        function del(k) { 
            if(confirm("Are you sure you want to delete this level?")) {
                db.ref('settings/vip_levels/' + k).remove();
            }
        }
    </script>
</body>
</html>
