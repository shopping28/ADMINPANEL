<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Credits & Packages</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: 'Outfit', sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { color: #00f2ff; margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; margin: 10px 0 5px; color: #94a3b8; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00f2ff; }

        button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-create { background: #00f2ff; color: #000; width: 100%; }
        .btn-action { background: #f59e0b; color: #000; width: 100%; }
        .btn-approve { background: #10b981; color: #fff; padding: 5px 10px; margin-right: 5px; }
        .btn-reject { background: #ef4444; color: #fff; padding: 5px 10px; }
        .btn-delete { background: #ef4444; color: #fff; padding: 5px 10px; float: right; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; font-size: 0.9rem; }
        th { color: #94a3b8; background: #0f172a; }
        
        .pack-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .final-price-display { margin-top: 10px; font-size: 1.1rem; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🛠️ Credit System & Packages</h1>

    <!-- 1. WALLET SETTINGS -->
    <div class="card">
        <h2>⚙️ Wallet Settings</h2>
        <label>Admin USDT (BEP20) Address:</label>
        <input type="text" id="adminWallet" placeholder="0x...">
        <button class="btn-create" onclick="saveWallet()">Save Wallet</button>
    </div>

    <!-- 2. GLOBAL FREE CREDITS -->
    <div class="card">
        <h2>🎁 Global Free Credits</h2>
        <input type="number" id="globalAmount" placeholder="Amount (e.g. 5)">
        <button class="btn-action" onclick="distributeFreeCredits()">Send to All Active Users</button>
    </div>

    <!-- 3. CREATE REDEEM CODE -->
    <div class="card">
        <h2>🎟 Create Redeem Code</h2>
        <div class="form-grid">
            <div><label>Code Name:</label><input type="text" id="redeemName" placeholder="e.g. BONUS100"></div>
            <div><label>Credits Amount:</label><input type="number" id="redeemAmount" placeholder="e.g. 10"></div>
        </div>
        <label>User Limit (Max Users):</label>
        <input type="number" id="redeemLimit" placeholder="e.g. 50">
        <button class="btn-create" onclick="createRedeemCode()">Create Code</button>

        <h3 style="margin-top:20px;">Active Codes</h3>
        <table>
            <thead><tr><th>Code</th><th>Amount</th><th>Usage</th><th>Action</th></tr></thead>
            <tbody id="redeemTable"><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
    </div>

    <!-- 4. CREATE DISCOUNT PACKAGE -->
    <div class="card">
        <h2>📦 Create Credit Package</h2>
        <div class="form-grid">
            <div><label>Credits:</label><input type="number" id="packCredits" placeholder="10"></div>
            <div><label>Price ($):</label><input type="number" id="packPrice" placeholder="5"></div>
        </div>
        <button class="btn-create" onclick="createPackage()">Add Package</button>
        <div id="packageList" style="margin-top:15px;">Loading...</div>
    </div>

    <!-- 5. PENDING ORDERS -->
    <div class="card">
        <h2>⏳ Pending Buy Orders</h2>
        <table>
            <thead><tr><th>User UID</th><th>Details</th><th>Payment</th><th>Action</th></tr></thead>
            <tbody id="orderTable"><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE", authDomain: "shopping28-84906.firebaseapp.com", databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com", projectId: "shopping28-84906", storageBucket: "shopping28-84906.firebasestorage.app", messagingSenderId: "252107906792", appId: "1:252107906792:web:d39b0be25c88e07015b35d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Wallet
        db.ref('settings/credits/wallet').on('value', s => document.getElementById('adminWallet').value = s.val() || "");
        function saveWallet() { db.ref('settings/credits/wallet').set(document.getElementById('adminWallet').value).then(()=>alert("Saved!")); }

        // 2. Global Credits
        function distributeFreeCredits() {
            const amt = parseFloat(document.getElementById('globalAmount').value);
            if(!amt) return alert("Enter amount");
            if(confirm("Send credits to ALL active users?")) {
                db.ref('users').once('value', s => {
                    let updates = {};
                    s.forEach(c => { if(c.val().status === 'active') updates[`users/${c.key}/credits`] = (c.val().credits||0) + amt; });
                    db.ref().update(updates).then(() => alert("Credits Sent!"));
                });
            }
        }

        // 3. Redeem Codes (Fixed Structure)
        function createRedeemCode() {
            const code = document.getElementById('redeemName').value.trim();
            const amt = parseFloat(document.getElementById('redeemAmount').value);
            const limit = parseInt(document.getElementById('redeemLimit').value);
            if(!code || !amt || !limit) return alert("Fill all");
            db.ref('redeem_codes/' + code).set({ amount: amt, limit: limit, used_count: 0 }).then(() => {
                alert("Code Created!"); document.getElementById('redeemName').value="";
            });
        }
        db.ref('redeem_codes').on('value', s => {
            const t = document.getElementById('redeemTable'); t.innerHTML = "";
            if(!s.exists()) { t.innerHTML="<tr><td colspan='4'>No codes</td></tr>"; return; }
            s.forEach(c => {
                const d = c.val();
                t.innerHTML += `<tr><td style="color:#00ff88">${c.key}</td><td>${d.amount}</td><td>${d.used_count||0} / ${d.limit}</td><td><button class="btn-delete" onclick="db.ref('redeem_codes/${c.key}').remove()">Del</button></td></tr>`;
            });
        });

        // 4. Packages
        function createPackage() {
            const c = document.getElementById('packCredits').value;
            const p = document.getElementById('packPrice').value;
            if(!c || !p) return;
            db.ref('settings/credit_packages').push({ credits: Number(c), finalPrice: Number(p) });
        }
        db.ref('settings/credit_packages').on('value', s => {
            const l = document.getElementById('packageList'); l.innerHTML = "";
            s.forEach(c => {
                l.innerHTML += `<div class="pack-item"><span>${c.val().credits} Credits - $${c.val().finalPrice}</span><button class="btn-delete" onclick="db.ref('settings/credit_packages/${c.key}').remove()">Del</button></div>`;
            });
        });

        // 5. Orders
        db.ref('credit_orders').orderByChild('status').equalTo('pending').on('value', s => {
            const t = document.getElementById('orderTable'); t.innerHTML = "";
            if(!s.exists()) { t.innerHTML="<tr><td colspan='4'>No orders</td></tr>"; return; }
            s.forEach(c => {
                const o = c.val();
                t.innerHTML += `<tr><td>${o.uid}</td><td>${o.credits} Credits ($${o.price})</td><td>From: ${o.sender}<br>Trx: ${o.trx}</td><td><button class="btn-approve" onclick="procOrder('${c.key}','${o.uid}',${o.credits},'approved')">✔</button><button class="btn-reject" onclick="procOrder('${c.key}','${o.uid}',0,'rejected')">✖</button></td></tr>`;
            });
        });
        function procOrder(k, u, c, s) {
            if(s==='approved') db.ref('users/'+u+'/credits').transaction(v=>(v||0)+c);
            db.ref('credit_orders/'+k).update({status:s}).then(()=>alert(s));
        }
    </script>
</body>
</html>
