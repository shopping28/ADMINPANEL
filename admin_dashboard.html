<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* DARK PREMIUM THEME */
        body { 
            background: #0f0c29; 
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            color: white; 
            font-family: 'Poppins', sans-serif; 
            padding: 20px; 
            margin: 0;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 20px; 
        }
        
        h2 { margin: 0; letter-spacing: 1px; }

        .logout-btn { 
            background: linear-gradient(45deg, #ff416c, #ff4b2b); 
            color: white; border: none; padding: 10px 25px; 
            border-radius: 30px; cursor: pointer; font-weight: bold; 
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: 0.3s;
        }
        .logout-btn:hover { transform: scale(1.05); }

        /* GRID LAYOUT */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: rgba(255,255,255,0.05); 
            padding: 25px; 
            border-radius: 20px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.05); 
            transition: 0.3s; 
            position: relative; 
            backdrop-filter: blur(5px);
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: #00f260; 
            background: rgba(255,255,255,0.1);
        }

        .card i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .card h4 { margin: 0; font-weight: 600; font-size: 0.9rem; color: #ddd; }
        
        /* NOTIFICATION BADGE */
        .badge {
            position: absolute; top: 10px; right: 10px;
            background: #e74c3c; color: white;
            width: 25px; height: 25px; border-radius: 50%;
            font-size: 0.8rem; display: flex; justify-content: center; align-items: center;
            font-weight: bold; border: 2px solid #1e1e2f;
            opacity: 0; transition: opacity 0.3s;
            box-shadow: 0 0 10px #e74c3c;
        }

        /* Colors for Icons */
        .c-act { color: #f1c40f; }
        .c-wit { color: #00f260; }
        .c-task { color: #3498db; }
        .c-user { color: #9b59b6; }
        .c-vip { color: #e67e22; }
        .c-man { color: #ff4757; }
        .c-set { color: #ecf0f1; }
        .c-del { color: #ff6b6b; text-shadow: 0 0 10px rgba(255, 107, 107, 0.4); } /* New for Delete */

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div>
            <h2>🔥 Master Control</h2>
            <small style="color:#aaa;">Admin Panel v2.1</small>
        </div>
        <button class="logout-btn" onclick="logout()">Logout <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <!-- Main Menu Grid -->
    <div class="grid">
        
        <!-- Activations -->
        <div class="card" onclick="window.location.href='admin_activation.html'">
            <div id="badge-act" class="badge">0</div>
            <i class="fas fa-bolt c-act"></i>
            <h4>Activations</h4>
        </div>
        
        <!-- Withdrawals -->
        <div class="card" onclick="window.location.href='admin_withdraw.html'">
            <div id="badge-wit" class="badge">0</div>
            <i class="fas fa-wallet c-wit"></i>
            <h4>Withdrawals</h4>
        </div>
        
        <!-- Manage Tasks -->
        <div class="card" onclick="window.location.href='admin_tasks.html'">
            <i class="fas fa-tasks c-task"></i>
            <h4>Manage Tasks</h4>
        </div>
        
        <!-- User List -->
        <div class="card" onclick="window.location.href='admin_users.html'">
            <i class="fas fa-users c-user"></i>
            <h4>User List</h4>
        </div>
        
        <!-- VIP Levels -->
        <div class="card" onclick="window.location.href='admin_vip.html'">
            <i class="fas fa-crown c-vip"></i>
            <h4>VIP Levels</h4>
        </div>

        <!-- Admin Manager -->
        <div class="card" onclick="window.location.href='admin_manager.html'">
            <i class="fas fa-user-shield c-man"></i>
            <h4>User Manager</h4>
        </div>

        <!-- NEW: RECYCLE BIN / DELETE USER -->
        <div class="card" onclick="window.location.href='admin_delete.html'" style="border-color: rgba(255, 107, 107, 0.3);">
            <i class="fas fa-trash-restore c-del"></i>
            <h4 style="color:#ff6b6b;">Recycle Bin</h4>
        </div>

        <!-- Settings -->
        <div class="card" onclick="window.location.href='admin_settings.html'">
            <i class="fas fa-cogs c-set"></i>
            <h4>System Settings</h4>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. Security Check
        if(localStorage.getItem('admin_logged') !== 'true') {
            window.location.href = 'admin_login.html';
        }
        
        // 2. Logout Function
        function logout() { 
            if(confirm("Logout from Admin Panel?")) {
                localStorage.removeItem('admin_logged'); 
                window.location.href = 'admin_login.html'; 
            }
        }

        // 3. Firebase Init
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 4. Live Badge Counters
        
        // Count Pending Activations
        db.ref('activation_requests').orderByChild('status').equalTo('pending').on('value', s => {
            const count = s.numChildren();
            const b = document.getElementById('badge-act');
            if(count > 0) { 
                b.innerText = count; 
                b.style.opacity = 1; 
            } else { 
                b.style.opacity = 0; 
            }
        });

        // Count Pending Withdrawals
        db.ref('withdraw_requests').orderByChild('status').equalTo('pending').on('value', s => {
            const count = s.numChildren();
            const b = document.getElementById('badge-wit');
            if(count > 0) { 
                b.innerText = count; 
                b.style.opacity = 1; 
            } else { 
                b.style.opacity = 0; 
            }
        });
    </script>
</body>
</html>
