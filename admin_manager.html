<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Update Balance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        
        /* Header & Back Button */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { 
            text-decoration: none; background: #333; color: white; padding: 8px 15px; 
            border-radius: 5px; font-weight: bold; transition: 0.3s; 
        }
        .back-btn:hover { background: #555; }

        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 5px; }

        /* Stats Cards */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;
        }
        .stat-card {
            padding: 15px; border-radius: 8px; text-align: center; color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .bg-total { background: linear-gradient(135deg, #667eea, #764ba2); }
        .bg-active { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-inactive { background: linear-gradient(135deg, #ff5f6d, #ffc371); }
        
        .stat-card h3 { margin: 0; font-size: 0.9rem; opacity: 0.9; }
        .stat-card span { font-size: 1.8rem; font-weight: bold; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
        
        input[type="number"] { padding: 8px; width: 80px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Action Buttons */
        .btn { padding: 8px 12px; border: none; color: white; border-radius: 4px; cursor: pointer; margin-left: 2px; font-size: 0.8rem; }
        .btn-up { background-color: #28a745; }
        .btn-down { background-color: #dc3545; }
        .btn-up:hover { background-color: #218838; }
        .btn-down:hover { background-color: #c82333; }

        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: white; }
        .s-active { background: #28a745; }
        .s-pending { background: #ffc107; color: black; }
        .s-banned { background: #dc3545; }

        #msg-status { text-align: center; margin-top: 10px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="admin_dashboard.html" class="back-btn">← Back Dashboard</a>
        <h3 style="margin:0;">Balance Manager</h3>
    </div>

    <!-- New Stats Section -->
    <div class="stats-grid">
        <div class="stat-card bg-total">
            <h3>Total Users</h3>
            <span id="count-total">0</span>
        </div>
        <div class="stat-card bg-active">
            <h3>Active Users</h3>
            <span id="count-active">0</span>
        </div>
        <div class="stat-card bg-inactive">
            <h3>Inactive/Pending</h3>
            <span id="count-inactive">0</span>
        </div>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>User Info</th>
                <th>Status</th>
                <th>Balance</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="userList">
            <tr><td colspan="4" style="text-align:center;">Loading database...</td></tr>
        </tbody>
    </table>
    <div id="msg-status"></div>
</div>

<!-- Firebase Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
    authDomain: "art-paid-work001.firebaseapp.com",
    databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
    projectId: "art-paid-work001",
    storageBucket: "art-paid-work001.firebasestorage.app",
    messagingSenderId: "524647364992",
    appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const usersRef = ref(db, 'users');
  
  onValue(usersRef, (snapshot) => {
    const userList = document.getElementById('userList');
    userList.innerHTML = ''; 

    const data = snapshot.val();
    
    // Counters
    let total = 0;
    let active = 0;
    let inactive = 0;

    if (data) {
      Object.keys(data).forEach(key => {
        const user = data[key];
        
        // Data Extraction
        const currentBal = user.balance ? parseFloat(user.balance) : 0;
        const userName = user.firstName ? user.firstName : (user.name || 'Unknown'); 
        const userPhone = user.phone || key;
        const status = user.status || 'pending';

        // Counting Logic
        total++;
        if(status === 'active') {
            active++;
        } else {
            inactive++;
        }

        // Status Badge Logic
        let badgeClass = 's-pending';
        if(status === 'active') badgeClass = 's-active';
        if(status === 'banned') badgeClass = 's-banned';

        // Table Row
        const row = `
          <tr>
            <td>
                <b>${userName}</b><br>
                <small style="color:gray">${userPhone}</small>
            </td>
            <td><span class="status-badge ${badgeClass}">${status.toUpperCase()}</span></td>
            <td style="font-weight:bold; color:#333;">৳${currentBal}</td>
            <td style="display:flex; align-items:center;">
                <input type="number" id="amount-${key}" placeholder="0">
                <button class="btn btn-up" onclick="window.updateBalance('${key}', ${currentBal}, 'add')">+</button>
                <button class="btn btn-down" onclick="window.updateBalance('${key}', ${currentBal}, 'sub')">-</button>
            </td>
          </tr>
        `;
        userList.innerHTML += row;
      });

      // Update Stats on Screen
      document.getElementById('count-total').innerText = total;
      document.getElementById('count-active').innerText = active;
      document.getElementById('count-inactive').innerText = inactive;

    } else {
      userList.innerHTML = '<tr><td colspan="4" style="text-align:center;">No users found</td></tr>';
      document.getElementById('count-total').innerText = 0;
      document.getElementById('count-active').innerText = 0;
      document.getElementById('count-inactive').innerText = 0;
    }
  });

  // Update Function
  window.updateBalance = function(userId, currentBalance, type) {
    const amountInput = document.getElementById(`amount-${userId}`);
    const amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {
      alert("Please enter a valid amount!");
      return;
    }

    let newBalance = currentBalance;
    if (type === 'add') newBalance += amount;
    if (type === 'sub') newBalance -= amount;

    update(ref(db, 'users/' + userId), {
      balance: newBalance
    })
    .then(() => {
      const msg = document.getElementById('msg-status');
      msg.innerText = "Balance Updated!";
      msg.style.color = "green";
      amountInput.value = "";
      setTimeout(() => { msg.innerText = ""; }, 2000);
    })
    .catch((error) => {
      alert("Error: " + error.message);
    });
  }
</script>

</body>
</html>
