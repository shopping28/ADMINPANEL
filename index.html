<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Admin Panel...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .loader-container { text-align: center; }
        .glitch {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            position: relative;
            text-shadow: 0.05em 0 0 #00f260, -0.03em -0.04em 0 #e74c3c,
                        0.025em 0.04em 0 #3498db;
            animation: glitch 725ms infinite;
        }
        .sub-text {
            color: #00f260;
            margin-top: 10px;
            letter-spacing: 5px;
            font-size: 1rem;
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
        }
        
        /* Loading Bar */
        .bar {
            width: 200px;
            height: 4px;
            background: #333;
            margin: 20px auto;
            border-radius: 2px;
            overflow: hidden;
        }
        .fill {
            width: 0%;
            height: 100%;
            background: #00f260;
            animation: load 2.5s ease-in-out forwards;
        }

        @keyframes load { 0% { width: 0; } 100% { width: 100%; } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #00f260, -0.03em -0.04em 0 #e74c3c, 0.025em 0.04em 0 #3498db; }
            15% { text-shadow: 0.05em 0 0 #00f260, -0.03em -0.04em 0 #e74c3c, 0.025em 0.04em 0 #3498db; }
            16% { text-shadow: -0.05em -0.025em 0 #00f260, 0.025em 0.035em 0 #e74c3c, -0.05em -0.05em 0 #3498db; }
            49% { text-shadow: -0.05em -0.025em 0 #00f260, 0.025em 0.035em 0 #e74c3c, -0.05em -0.05em 0 #3498db; }
            50% { text-shadow: 0.05em 0.035em 0 #00f260, 0.03em 0 0 #e74c3c, 0 -0.04em 0 #3498db; }
            99% { text-shadow: 0.05em 0.035em 0 #00f260, 0.03em 0 0 #e74c3c, 0 -0.04em 0 #3498db; }
            100% { text-shadow: -0.05em 0 0 #00f260, -0.025em -0.04em 0 #e74c3c, -0.04em -0.025em 0 #3498db; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="glitch">THE ADMIN PANEL</div>
        <div class="bar"><div class="fill"></div></div>
        <div class="sub-text">SYSTEM INITIALIZING...</div>
    </div>

    <script>
        setTimeout(() => {
            // Check if already logged in
            if(localStorage.getItem('admin_logged') === 'true') {
                window.location.href = 'admin_dashboard.html';
            } else {
                window.location.href = 'admin_login.html';
            }
        }, 3000); // 3 Seconds Delay
    </script>
</body>
</html>
