<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Challenge Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- PREMIUM DARK THEME --- */
        :root { 
            --bg-dark: #050511; 
            --card-dark: #121225; 
            --card-border: #23233c;
            --primary: #5b4dd4; 
            --gold: #fccb44; 
            --green: #00d26a; 
            --red: #f8312f; 
            --text-gray: #a0a0b0;
        }
        
        body { margin: 0; padding: 20px; background: var(--bg-dark); color: #fff; font-family: 'Outfit', sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 50px; }

        /* HEADER */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
        .page-title { font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, #fff, #a0a0b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: rgba(255,255,255,0.05); color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; border: 1px solid var(--card-border); transition:0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* TABS */
        .tabs { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; background: var(--card-dark); padding: 8px; border-radius: 16px; border: 1px solid var(--card-border); }
        .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: var(--text-gray); border-radius: 12px; cursor: pointer; font-weight: 600; font-family: 'Outfit', sans-serif; transition: 0.3s; font-size: 0.95rem; }
        .tab-btn i { margin-right: 8px; }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 5px 15px rgba(91, 77, 212, 0.4); }
        .tab-active-users.active { background: #333 !important; }

        /* SECTION DISPLAY */
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM CARD */
        .form-card { background: var(--card-dark); padding: 25px; border-radius: 20px; border: 1px solid var(--card-border); margin-bottom: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .section-title { margin: 0 0 20px 0; font-size: 1.2rem; color: var(--gold); display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .inp-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .inp-group input, .inp-group select { width: 100%; padding: 14px; background: #0b0b18; border: 1px solid var(--card-border); color: #fff; border-radius: 10px; box-sizing: border-box; font-family: 'Outfit', sans-serif; outline: none; transition: 0.3s; }
        .inp-group input:focus { border-color: var(--primary); }
        .btn-save { width: 100%; background: linear-gradient(135deg, var(--green), #00b85c); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 210, 106, 0.3); }

        /* LIST GRIDS */
        .req-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        /* PREMIUM CARD STYLE */
        .card-item { background: var(--card-dark); border-radius: 20px; border: 1px solid var(--card-border); overflow: hidden; position: relative; transition: 0.3s; display: flex; flex-direction: column; }
        .card-item:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.1); }
        .card-top { padding: 15px 20px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); }
        .badge { padding: 5px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-w { background: rgba(52, 152, 219, 0.15); color: #3498db; }
        .badge-m { background: rgba(155, 89, 182, 0.15); color: #9b59b6; }
        .badge-date { font-size: 0.75rem; color: var(--text-gray); }

        /* USER DETAILS BOX */
        .user-box { padding: 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--card-border); }
        .u-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, #333, #555); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: #fff; }
        .u-info h4 { margin: 0; font-size: 1rem; color: #fff; }
        .u-info p { margin: 3px 0 0; font-size: 0.75rem; color: var(--text-gray); font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; display: inline-block; }

        /* TASK DETAILS */
        .task-info { padding: 20px; flex: 1; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .info-lbl { color: var(--text-gray); }
        .info-val { font-weight: 600; color: #fff; }
        .val-gold { color: var(--gold); }
        .val-green { color: var(--green); }

        /* ACTIONS */
        .action-area { padding: 20px; padding-top: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-approve { background: var(--green); color: #000; }
        .btn-reject { background: rgba(248, 49, 47, 0.1); color: var(--red); border: 1px solid rgba(248, 49, 47, 0.3); }
        .btn-del { width: 100%; background: #222; color: #aaa; margin-top: 15px; }

        /* PROGRESS BAR */
        .prog-container { width: 100%; background: #222; height: 6px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .prog-bar { height: 100%; background: var(--primary); border-radius: 10px; }

        .empty-msg { text-align: center; padding: 50px; color: var(--text-gray); font-style: italic; grid-column: 1/-1; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER -->
        <div class="header">
            <a href="admin_dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <div class="page-title">Challenge Manager</div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('setup')"><i class="fas fa-sliders-h"></i> Setup Targets</button>
            <button class="tab-btn" onclick="showTab('apply_req')"><i class="fas fa-user-check"></i> Target Requests</button>
            <button class="tab-btn" onclick="showTab('reward_req')"><i class="fas fa-trophy"></i> Reward Claims</button>
            <button class="tab-btn tab-active-users" onclick="showTab('active_users')"><i class="fas fa-users"></i> Active Users</button>
        </div>

        <!-- 1. SETUP SECTION -->
        <div id="setup" class="section active">
            <div class="form-card">
                <h3 class="section-title"><i class="fas fa-plus-circle"></i> Add / Update Level</h3>
                <div class="form-grid">
                    <div class="inp-group"><label>Type</label><select id="t_type"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
                    <div class="inp-group"><label>Level No</label><input type="number" id="t_lvl" placeholder="Ex: 1"></div>
                    <div class="inp-group"><label>Target Referrals</label><input type="number" id="t_target" placeholder="Ex: 10"></div>
                    <div class="inp-group"><label>Reward Amount ($)</label><input type="number" id="t_reward" placeholder="Ex: 5"></div>
                    <div class="inp-group"><label>Entry Cost (Credits)</label><input type="number" id="t_cost" placeholder="Ex: 2"></div>
                    <div class="inp-group"><label style="color:var(--gold)">Duration (Days)</label><input type="number" id="t_days" placeholder="Ex: 7"></div>
                </div>
                <button class="btn-save" onclick="addLevel()">Save Configuration</button>
            </div>

            <h3 style="margin-left:5px; color:#fff;">Active Levels</h3>
            <div id="activeLevels" class="req-grid"><div class="empty-msg">Loading...</div></div>
        </div>

        <!-- 2. APPLY REQUESTS -->
        <div id="apply_req" class="section">
            <div id="applyList" class="req-grid"><div class="empty-msg">Checking for requests...</div></div>
        </div>

        <!-- 3. REWARD REQUESTS -->
        <div id="reward_req" class="section">
            <div id="rewardList" class="req-grid"><div class="empty-msg">Checking for rewards...</div></div>
        </div>

        <!-- 4. ACTIVE USERS -->
        <div id="active_users" class="section">
            <div id="activeUsersList" class="req-grid"><div class="empty-msg">Loading active users...</div></div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE", authDomain: "shopping28-84906.firebaseapp.com", databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com", projectId: "shopping28-84906", storageBucket: "shopping28-84906.firebasestorage.app", messagingSenderId: "252107906792", appId: "1:252107906792:web:d39b0be25c88e07015b35d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const RATE = 120; // 1 USD = 120 BDT
        let initApply = true, initReward = true;

        // --- UTILS ---
        function showTab(id) {
            document.querySelectorAll('.section').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.closest('button').classList.add('active');
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const msg = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(msg);
            }
        }

        function getAvatar(name) {
            return name ? name.charAt(0).toUpperCase() : 'U';
        }

        // --- 1. SETUP LOGIC ---
        function addLevel() {
            const type = document.getElementById('t_type').value, lvl = document.getElementById('t_lvl').value, target = document.getElementById('t_target').value, reward = document.getElementById('t_reward').value, cost = document.getElementById('t_cost').value, days = document.getElementById('t_days').value;
            if(!lvl || !target || !reward || !cost || !days) return alert("Fill all fields!");
            db.ref(`settings/targets/${type}/${lvl}`).set({ level: Number(lvl), target: Number(target), reward: Number(reward), cost: Number(cost), duration: Number(days), type }).then(() => { alert("Saved!"); document.getElementById('t_lvl').value=""; });
        }
        
        db.ref('settings/targets').on('value', snap => {
            const container = document.getElementById('activeLevels'); container.innerHTML = "";
            if(!snap.exists()) { container.innerHTML = "<div class='empty-msg'>No levels configured.</div>"; return; }
            const data = snap.val();
            if(data.weekly) Object.values(data.weekly).forEach(l => renderLevelCard(l, container));
            if(data.monthly) Object.values(data.monthly).forEach(l => renderLevelCard(l, container));
        });

        function renderLevelCard(l, parent) {
            const badgeClass = l.type === 'weekly' ? 'badge-w' : 'badge-m';
            parent.innerHTML += `
            <div class="card-item">
                <div class="card-top">
                    <span class="badge ${badgeClass}">${l.type}</span>
                    <span style="font-weight:bold; color:#fff;">LVL ${l.level}</span>
                </div>
                <div class="task-info">
                    <div class="info-row"><span class="info-lbl">Target</span><span class="info-val">${l.target} Refs</span></div>
                    <div class="info-row"><span class="info-lbl">Reward</span><span class="info-val val-green">$${l.reward}</span></div>
                    <div class="info-row"><span class="info-lbl">Cost</span><span class="info-val">${l.cost} Credits</span></div>
                    <div class="info-row"><span class="info-lbl">Duration</span><span class="info-val val-gold">${l.duration} Days</span></div>
                </div>
                <div style="padding:15px;">
                    <button class="btn btn-del" onclick="if(confirm('Delete Level?')) db.ref('settings/targets/${l.type}/${l.level}').remove()">Delete</button>
                </div>
            </div>`;
        }

        // --- 2. APPLY REQUESTS (With User Details) ---
        db.ref('target_requests').orderByChild('status').equalTo('pending').on('value', snap => {
            const list = document.getElementById('applyList'); list.innerHTML = "";
            let count = 0;
            
            if(snap.exists()) {
                snap.forEach(child => {
                    const k = child.key; 
                    const d = child.val();
                    count++;
                    
                    // Fetch User Details Inside Loop
                    db.ref('users/' + d.uid).once('value', uSnap => {
                        const u = uSnap.val() || {};
                        const uName = u.name || "Unknown User";
                        const uReg = d.uid; // Using UID as Reg ID

                        list.innerHTML += `
                        <div class="card-item">
                            <div class="card-top">
                                <span class="badge badge-w">APPLY REQUEST</span>
                                <span class="badge-date">${new Date(d.timestamp).toLocaleDateString()}</span>
                            </div>
                            <div class="user-box">
                                <div class="u-avatar">${getAvatar(uName)}</div>
                                <div class="u-info">
                                    <h4>${uName}</h4>
                                    <p>Reg ID: ${uReg.substring(0,12)}...</p>
                                </div>
                            </div>
                            <div class="task-info">
                                <div class="info-row"><span class="info-lbl">Level Apply</span><span class="info-val">${d.type.toUpperCase()} - LVL ${d.level}</span></div>
                                <div class="info-row"><span class="info-lbl">Cost Paid</span><span class="info-val">${d.cost} Credits</span></div>
                                <div class="info-row"><span class="info-lbl">Required Target</span><span class="info-val">${d.targetCount} Refs</span></div>
                            </div>
                            <div class="action-area">
                                <button class="btn btn-approve" onclick="approveApply('${k}','${d.uid}','${d.type}',${d.level},${d.targetCount},${d.reward})">Approve</button>
                                <button class="btn btn-reject" onclick="rejectApply('${k}','${d.uid}',${d.cost})">Reject</button>
                            </div>
                        </div>`;
                    });
                });
            } else { list.innerHTML = "<div class='empty-msg'>No pending applications.</div>"; }
            
            if(!initApply && count > 0) speak("New Target Request Received");
            initApply = false;
        });

        // APPROVE FUNCTION
        function approveApply(key, uid, type, level, target, reward) {
            if(!confirm("Start Challenge for User?")) return;
            db.ref(`settings/targets/${type}/${level}`).once('value', s => {
                const settings = s.val();
                const days = (settings && settings.duration) ? settings.duration : 30;
                db.ref('users/'+uid+'/ownCode').once('value', c => {
                    db.ref('users').orderByChild('referredBy').equalTo(c.val()).once('value', team => {
                        let activeCount = 0; team.forEach(u => { if(u.val().status === 'active') activeCount++; });
                        const endTime = Date.now() + (days * 24 * 60 * 60 * 1000);
                        const updates = {};
                        updates['target_requests/'+key+'/status'] = 'approved';
                        updates['users/'+uid+'/active_target'] = { type, level, targetCount: target, reward, startCount: activeCount, startTime: Date.now(), endTime, durationDays: days };
                        db.ref().update(updates).then(() => alert("Approved & Started!"));
                    });
                });
            });
        }

        // REJECT FUNCTION
        function rejectApply(key, uid, cost) {
            const reason = prompt("Reason for rejection:"); if(!reason) return;
            db.ref('users/'+uid+'/credits').once('value', s => {
                db.ref().update({ 
                    ['target_requests/'+key+'/status']: 'rejected', 
                    ['users/'+uid+'/credits']: (s.val()||0)+cost, 
                    ['users/'+uid+'/last_rejection']: reason, 
                    ['users/'+uid+'/rejection_seen']: false 
                }).then(() => alert("Rejected & Refunded."));
            });
        }

        // --- 3. REWARD REQUESTS (With User Details) ---
        db.ref('reward_requests').orderByChild('status').equalTo('pending').on('value', snap => {
            const list = document.getElementById('rewardList'); list.innerHTML = "";
            let count = 0;
            
            if(snap.exists()) {
                snap.forEach(child => {
                    const k = child.key; 
                    const d = child.val();
                    count++;

                    db.ref('users/' + d.uid).once('value', uSnap => {
                        const u = uSnap.val() || {};
                        const uName = u.name || "Unknown User";
                        const uReg = d.uid;

                        list.innerHTML += `
                        <div class="card-item reward-card" style="border-left: 4px solid var(--blue)">
                            <div class="card-top">
                                <span class="badge badge-m" style="background:var(--blue); color:#fff;">CLAIM REQUEST</span>
                                <span class="badge-date">${new Date(d.timestamp).toLocaleDateString()}</span>
                            </div>
                            <div class="user-box">
                                <div class="u-avatar" style="background:#3498db">${getAvatar(uName)}</div>
                                <div class="u-info">
                                    <h4>${uName}</h4>
                                    <p>Reg ID: ${uReg.substring(0,12)}...</p>
                                </div>
                            </div>
                            <div class="task-info">
                                <div class="info-row"><span class="info-lbl">Challenge</span><span class="info-val">Level ${d.level}</span></div>
                                <div class="info-row"><span class="info-lbl">Reward Due</span><span class="info-val val-green" style="font-size:1.2rem;">$${d.reward}</span></div>
                            </div>
                            <div class="action-area">
                                <button class="btn btn-approve" style="background:var(--blue); color:#fff;" onclick="approveReward('${k}','${d.uid}',${d.reward},'${d.type}')">Send Payment</button>
                                <button class="btn btn-reject" onclick="if(confirm('Reject?')) db.ref('reward_requests/${k}').update({status:'rejected'})">Reject</button>
                            </div>
                        </div>`;
                    });
                });
            } else { list.innerHTML = "<div class='empty-msg'>No reward claims pending.</div>"; }

            if(!initReward && count > 0) speak("New Reward Request Received");
            initReward = false;
        });

        function approveReward(key, uid, amountUSD, type) {
            if(!confirm(`Send $${amountUSD} to user?`)) return;
            const amountBDT = amountUSD * RATE;
            db.ref('users/'+uid+'/balance').transaction(b => (b||0) + amountBDT);
            db.ref('users/'+uid+'/target_rewards').push({ amount: amountUSD, amountBDT: amountBDT, type: type, timestamp: Date.now() });
            const updates = {};
            updates['reward_requests/'+key+'/status'] = 'approved';
            updates['users/'+uid+'/active_target'] = null;
            db.ref().update(updates).then(() => alert("Reward Sent!"));
        }

        // --- 4. ACTIVE USERS LIST ---
        db.ref('users').on('value', snap => {
            const list = document.getElementById('activeUsersList'); 
            const users = snap.val();
            if(!users) return;

            // Calculate Referrals Map
            let refCounts = {};
            Object.values(users).forEach(u => {
                if(u.referredBy && u.status === 'active') {
                    refCounts[u.referredBy] = (refCounts[u.referredBy] || 0) + 1;
                }
            });

            list.innerHTML = "";
            let hasActive = false;

            Object.keys(users).forEach(key => {
                const u = users[key];
                if(u.active_target) {
                    hasActive = true;
                    const t = u.active_target;
                    
                    // Time Left Logic
                    const now = Date.now();
                    const diff = (t.endTime || 0) - now;
                    let timeStr = "Expired";
                    let timeColor = "#ff4757";
                    
                    if(diff > 0) {
                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        timeStr = `${days}d ${hours}h Left`;
                        timeColor = "#f1c40f";
                    }

                    // Progress Logic
                    const currentTotal = refCounts[u.ownCode] || 0;
                    let prog = currentTotal - (t.startCount || 0);
                    if(prog < 0) prog = 0;
                    const pct = Math.min((prog / t.targetCount) * 100, 100);

                    list.innerHTML += `
                    <div class="card-item" style="border-left: 4px solid var(--primary)">
                        <div class="card-top">
                            <span class="badge" style="background:#333; color:#fff;">ACTIVE</span>
                            <span class="badge-date">${t.type.toUpperCase()} LVL ${t.level}</span>
                        </div>
                        <div class="user-box">
                            <div class="u-avatar" style="background:var(--primary)">${getAvatar(u.name)}</div>
                            <div class="u-info">
                                <h4>${u.name || 'Unknown'}</h4>
                                <p>UID: ${key.substring(0,8)}..</p>
                            </div>
                        </div>
                        <div class="task-info">
                            <div class="info-row"><span class="info-lbl">Progress</span><span class="info-val">${prog} / ${t.targetCount} Refs</span></div>
                            <div class="info-row"><span class="info-lbl">Time</span><span class="info-val" style="color:${timeColor}">${timeStr}</span></div>
                            <div class="prog-container">
                                <div class="prog-bar" style="width:${pct}%"></div>
                            </div>
                        </div>
                        <div style="padding:15px;">
                            <button class="btn btn-del" onclick="if(confirm('Stop challenge for this user?')) db.ref('users/${key}/active_target').remove()">Force Stop</button>
                        </div>
                    </div>`;
                }
            });

            if(!hasActive) list.innerHTML = "<div class='empty-msg'>No active users found.</div>";
        });

    </script>
</body>
</html>
