<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Challenge Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #050505; --card-bg: #0f172a; --text-main: #ffffff; --text-muted: #94a3b8; --neon-green: #10b981; --neon-red: #ef4444; --neon-blue: #3b82f6; --neon-purple: #a855f7; }
        body { margin: 0; padding: 20px; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Outfit', sans-serif; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-main); }
        .logo span { color: var(--neon-blue); }

        .container { max-width: 800px; margin: 0 auto; }
        .section-title { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .req-card { 
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; border-radius: 16px; margin-bottom: 15px; 
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .req-header { display: flex; justify-content: space-between; align-items: center; }
        .req-type { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .type-weekly { background: rgba(59, 130, 246, 0.2); color: var(--neon-blue); border: 1px solid var(--neon-blue); }
        .type-monthly { background: rgba(168, 85, 247, 0.2); color: var(--neon-purple); border: 1px solid var(--neon-purple); }

        .user-info { font-size: 1.1rem; font-weight: 700; }
        .req-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .det-item b { color: #fff; margin-left: 5px; }

        .action-area { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-approve { background: var(--neon-green); color: #000; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { background: rgba(239, 68, 68, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); }
        .btn-reject:hover { background: var(--neon-red); color: #fff; }

        .empty-msg { text-align: center; color: var(--text-muted); padding: 40px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">ADMIN <span>PANEL</span></div>
            <div style="font-size:0.9rem; color:#aaa;">Task Requests</div>
        </div>

        <div class="section-title">Pending Approvals</div>
        <div id="requestList">
            <div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Loading requests...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // UPDATED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for Pending Requests
        db.ref('target_requests').on('value', snap => {
            const list = document.getElementById('requestList');
            list.innerHTML = "";
            let hasData = false;

            if(snap.exists()) {
                snap.forEach(child => {
                    const key = child.key;
                    const data = child.val();

                    if(data.status === 'pending') {
                        hasData = true;
                        renderCard(key, data, list);
                    }
                });
            }

            if(!hasData) list.innerHTML = `<div class="empty-msg">No pending requests found.</div>`;
        });

        function renderCard(key, data, container) {
            const date = new Date(data.timestamp).toLocaleString();
            const typeClass = data.type === 'weekly' ? 'type-weekly' : 'type-monthly';
            
            const html = `
                <div class="req-card">
                    <div class="req-header">
                        <span class="req-type ${typeClass}">${data.type.toUpperCase()} CHALLENGE</span>
                        <span style="font-size:0.8rem; opacity:0.6;">${date}</span>
                    </div>
                    <div class="user-info">User UID: <span style="font-family:monospace; color:var(--neon-blue)">${data.uid}</span></div>
                    
                    <div class="req-details">
                        <div class="det-item">Level: <b>${data.level}</b></div>
                        <div class="det-item">Target: <b>${data.targetCount} Refs</b></div>
                        <div class="det-item">Reward: <b>$${data.reward}</b></div>
                        <div class="det-item">Cost Paid: <b>${data.cost} Credits</b></div>
                    </div>

                    <div class="action-area">
                        <button class="btn btn-reject" onclick="rejectRequest('${key}', '${data.uid}', ${data.cost})">Reject & Refund</button>
                        <button class="btn btn-approve" onclick="approveRequest('${key}', '${data.uid}', '${data.type}', ${data.level}, ${data.targetCount}, ${data.reward})">Approve & Start</button>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        }

        function approveRequest(key, uid, type, level, target, reward) {
            if(!confirm("Approve this request? User's challenge will start immediately.")) return;

            // 1. Get User's Current Active Team Count (This becomes the "Start Point")
            db.ref('users/'+uid+'/ownCode').once('value', snap => {
                const code = snap.val();
                if(!code) return alert("User code not found!");

                db.ref('users').orderByChild('referredBy').equalTo(code).once('value', teamSnap => {
                    let activeCount = 0;
                    teamSnap.forEach(u => { if(u.val().status === 'active') activeCount++; });

                    // 2. Calculate End Time
                    const durationDays = (type === 'weekly') ? 7 : 30;
                    const endTime = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

                    // 3. Update Database
                    const updates = {};
                    // Mark request as approved
                    updates['target_requests/'+key+'/status'] = 'approved';
                    // Set User's Active Target
                    updates['users/'+uid+'/active_target'] = {
                        type: type,
                        level: level,
                        targetCount: target,
                        reward: reward,
                        startCount: activeCount, // Critical: Only new refs count
                        startTime: Date.now(),
                        endTime: endTime
                    };

                    db.ref().update(updates).then(() => alert("Request Approved & Challenge Started!"));
                });
            });
        }

        function rejectRequest(key, uid, cost) {
            const reason = prompt("Enter rejection reason (User will see this):", "Requirements not met");
            if(!reason) return;

            const updates = {};
            // Mark request rejected
            updates['target_requests/'+key+'/status'] = 'rejected';
            // Refund Credits
            // Note: We need transaction for safety, but direct update is simpler for admin panel MVP
            db.ref('users/'+uid+'/credits').once('value', s => {
                let current = s.val() || 0;
                updates['users/'+uid+'/credits'] = current + cost;
                updates['users/'+uid+'/last_rejection'] = reason;
                updates['users/'+uid+'/rejection_seen'] = false; // Trigger popup on user side

                db.ref().update(updates).then(() => alert("Request Rejected & Credits Refunded."));
            });
        }
    </script>
</body>
</html>
