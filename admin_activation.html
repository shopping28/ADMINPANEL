<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .req { background: #1a1a2e; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #444; border-left: 5px solid #f39c12; }
        .info-row { margin-bottom: 10px; font-size: 0.95rem; }
        .label { color: #aaa; font-size: 0.8rem; display: block; }
        .val { color: #fff; font-weight: 600; font-family: monospace; letter-spacing: 0.5px; }
        
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .app { background: #00f260; color: #000; } 
        .app:disabled { background: #555; cursor: not-allowed; color: #ccc; }
        .rej { background: #e74c3c; color: white; }
        
        /* Toast CSS */
        #toast-box { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #1e1e2f; color: white; min-width: 250px; padding: 15px 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border-left: 5px solid #00f260; display: flex; align-items: center; gap: 15px; animation: slideIn 0.3s ease-out forwards; }
        .toast.error { border-left-color: #e74c3c; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="toast-box"></div>
    <a href="admin_dashboard.html" style="color:#aaa; text-decoration:none;">← Back to Dashboard</a>
    <h2>Pending Activations</h2>
    <div id="list">Loading...</div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showToast(msg, type = 'success') {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = type === 'success' ? `✅ ${msg}` : `❌ ${msg}`;
            box.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300) }, 3000);
        }

        // Real-time listener for Pending Requests
        db.ref('activation_requests').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
            const list = document.getElementById('list'); list.innerHTML = "";
            if(!snapshot.exists()) { list.innerHTML = "<p style='color:#777'>No pending requests.</p>"; return; }
            
            snapshot.forEach((child) => {
                const d = child.val();
                // DISPLAY UPDATE: Showing Sender Wallet and TrxID instead of Phone
                const html = `
                <div class="req" id="card-${child.key}">
                    <div class="info-row">
                        <span class="label">User Sender Wallet:</span>
                        <span class="val" style="color:#00d2d3">${d.senderWallet || 'No Address'}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Transaction ID (TrxID):</span>
                        <span class="val" style="color:#f39c12">${d.trxId}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Amount:</span>
                        <span class="val">$${d.amount}</span>
                    </div>
                    <div style="margin-top:15px;">
                        <button id="btn-${child.key}" class="app" onclick="approve('${child.key}', '${d.uid}')">ACCEPT & ACTIVATE</button>
                        <button class="rej" onclick="reject('${child.key}')">REJECT</button>
                    </div>
                </div>`;
                list.innerHTML += html;
            });
        });

        async function approve(key, uid) {
            const btn = document.getElementById('btn-' + key);
            
            // 1. Disable button instantly to prevent double clicks
            if(btn) { btn.disabled = true; btn.innerText = "Verifying..."; }

            try {
                // 2. Security Check: Is the request still pending? (Prevents race conditions)
                const reqRef = db.ref('activation_requests/' + key);
                const reqSnap = await reqRef.once('value');
                
                if (!reqSnap.exists() || reqSnap.val().status !== 'pending') {
                    showToast("Request already processed by another admin!", "error");
                    return;
                }

                // 3. Security Check: Is the user already active?
                const userRef = db.ref('users/' + uid);
                const userSnap = await userRef.once('value');
                const user = userSnap.val();

                if (!user) {
                    showToast("User data not found!", "error");
                    reqRef.update({status: 'rejected', reason: 'User not found'});
                    return;
                }

                if (user.status === 'active') {
                    // Update request status but DO NOT give bonus
                    await reqRef.update({status: 'approved_duplicate', note: 'User was already active'});
                    showToast("User was already active. Request cleared.", "error");
                    return;
                }

                // 4. Everything OK -> Distribute Bonus
                const ratesSnap = await db.ref('settings/commissions').once('value');
                const rates = ratesSnap.val() || {level1:0, level2:0, level3:0};

                if(user.referredBy && user.referredBy !== "the_art2000") {
                    await distribute(user.referredBy, 1, rates);
                }

                // 5. Final Activation
                await userRef.update({ status: 'active', activatedAt: firebase.database.ServerValue.TIMESTAMP });
                await reqRef.update({ status: 'approved' });

                showToast("User Activated Successfully!", "success");

            } catch (error) {
                console.error(error);
                showToast("Error activating user: " + error.message, "error");
                if(btn) { btn.disabled = false; btn.innerText = "ACCEPT & ACTIVATE"; }
            }
        }

        async function distribute(code, lvl, rates) {
            if(lvl > 3) return;
            // Find referrer by their Invite Code
            const snap = await db.ref('users').orderByChild('ownCode').equalTo(code).once('value');
            
            if(snap.exists()) {
                const pid = Object.keys(snap.val())[0]; // Parent UID
                const pdata = Object.values(snap.val())[0];
                
                let amt = 0;
                if(lvl === 1) amt = parseFloat(rates.level1);
                else if(lvl === 2) amt = parseFloat(rates.level2);
                else if(lvl === 3) amt = parseFloat(rates.level3);
                
                if(amt > 0) {
                    await db.ref('users/'+pid).update({
                        balance: (parseFloat(pdata.balance) || 0) + amt
                    });
                }
                
                // Recursion for next level
                if(pdata.referredBy && pdata.referredBy !== "the_art2000") {
                    await distribute(pdata.referredBy, lvl+1, rates);
                }
            }
        }

        function reject(key) { 
            if(confirm("Confirm Reject? user will need to submit again.")) {
                db.ref('activation_requests/'+key).update({status:'rejected'}); 
                showToast("Request Rejected", "error");
            }
        }
    </script>
</body>
</html>
